name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -f dist/signal-ecogaz-card.js ]; then
            echo "Build failed - dist/signal-ecogaz-card.js not found"
            exit 1
          fi
          echo "Build successful - dist/signal-ecogaz-card.js created"
          ls -lh dist/

      - name: Upload build artifact
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist/
          retention-days: 7

  test:
    name: Type check and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  bundle-size:
    name: Bundle size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          SIZE=$(wc -c < dist/signal-ecogaz-card.js)
          echo "Bundle size: $((SIZE / 1024)) KB"
          if [ "$SIZE" -gt 1048576 ]; then
            echo "::warning::Bundle size is larger than 1 MB"
          else
            echo "Bundle size is acceptable"
          fi

  code-quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for console.log statements
        run: |
          if grep -rn "console\.log" src/; then
            echo "::warning::Found console.log statements in src/"
          else
            echo "No console.log statements found"
          fi

      - name: Check for TODO comments
        run: |
          if grep -rn "TODO\|FIXME" src/; then
            echo "::notice::Found TODO/FIXME comments in src/"
          else
            echo "No TODO comments found"
          fi
