<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal EcoGaz Card — Screenshot light/dark</title>
  <script type="module" src="/dist/signal-ecogaz-card.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      --primary-color: #03a9f4;
      --primary-text-color: #212121;
      --secondary-text-color: #757575;
      --card-background-color: #ffffff;
      --secondary-background-color: #fafafa;
      --divider-color: #e0e0e0;
      --success-color: #4caf50;
      --error-color: #f44336;
      --warning-color: #ff9800;
      --info-color: #2196f3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    html.dark {
      --primary-text-color: #ffffff;
      --secondary-text-color: #bdbdbd;
      --card-background-color: #303030;
      --secondary-background-color: #424242;
      --divider-color: #616161;
      background: #303030;
      color: #ffffff;
    }
    body { padding: 20px; background: var(--secondary-background-color); }
    #container { max-width: 420px; min-height: 200px; }
  </style>
</head>
<body>
  <div id="container"></div>
  <script>
    // --- Minimal stand-ins for Home Assistant frontend elements (ha-*) so the
    // card renders standalone outside of Home Assistant. ---
    const ICON_EMOJI = {
      'check-circle': '✅',
      'alert': '⚠️',
      'power-plug-off': '⛔',
      'progress-question': '❓',
    };

    function emojiFor(icon) {
      const name = (icon || '').split(':').pop();
      return ICON_EMOJI[name] || '●';
    }

    class HaCard extends HTMLElement {
      constructor() { super(); this.attachShadow({ mode: 'open' }); }
      connectedCallback() {
        this.shadowRoot.innerHTML = `
          <style>
            :host { display: block; border: 1px solid var(--divider-color, #e0e0e0); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); background: var(--card-background-color, #fff); box-sizing: border-box; font-family: inherit; }
          </style>
          <slot></slot>`;
      }
    }
    customElements.define('ha-card', HaCard);

    class HaIcon extends HTMLElement {
      static get observedAttributes() { return ['icon']; }
      constructor() { super(); this.attachShadow({ mode: 'open' }); }
      connectedCallback() { this.render(); }
      attributeChangedCallback() { this.render(); }
      render() {
        this.shadowRoot.innerHTML = `
          <style>
            :host { display: inline-block; width: var(--mdc-icon-size, 24px); height: var(--mdc-icon-size, 24px); vertical-align: middle; line-height: 1; font-size: var(--mdc-icon-size, 24px); color: inherit; }
          </style>
          <span>${emojiFor(this.getAttribute('icon'))}</span>`;
      }
    }
    customElements.define('ha-icon', HaIcon);

    function state(entityId, value, indice, friendlyName) {
      return {
        entity_id: entityId,
        state: String(value),
        attributes: {
          friendly_name: friendlyName,
          indice_de_couleur: indice,
          unit_of_measurement: '',
        },
        last_changed: '2026-11-24T08:00:00.000Z',
        last_updated: '2026-11-24T08:00:00.000Z',
      };
    }

    async function main() {
      const tagName = 'signal-ecogaz-card';
      while (!customElements.get(tagName)) {
        await new Promise(r => setTimeout(r, 50));
      }

      const card = document.createElement(tagName);
      card.hass = {
        // Signaux variés pour illustrer les quatre niveaux ÉcoGaz (normal,
        // élevé, tendu, critique) et le jour sans donnée.
        states: {
          'sensor.signal_ecogaz_level_in_0_days': state('sensor.signal_ecogaz_level_in_0_days', 'Signal normal', 1, 'Signal ÉcoGaz aujourd\u2019hui'),
          'sensor.signal_ecogaz_level_in_1_days': state('sensor.signal_ecogaz_level_in_1_days', 'Signal élevé', 2, 'Signal ÉcoGaz demain'),
          'sensor.signal_ecogaz_level_in_2_days': state('sensor.signal_ecogaz_level_in_2_days', 'Signal tendu', 3, 'Signal ÉcoGaz dans 2 jours'),
          'sensor.signal_ecogaz_level_in_3_days': state('sensor.signal_ecogaz_level_in_3_days', 'Signal critique', 4, 'Signal ÉcoGaz dans 3 jours'),
          'sensor.signal_ecogaz_level_in_4_days': { entity_id: 'sensor.signal_ecogaz_level_in_4_days', state: 'unavailable', attributes: { friendly_name: 'Signal ÉcoGaz dans 4 jours' }, last_changed: '', last_updated: '' },
        },
        language: 'fr',
        locale: { language: 'fr' },
        callService: () => Promise.resolve(),
      };

      try {
        card.setConfig({
          entities: [
            'sensor.signal_ecogaz_level_in_0_days',
            'sensor.signal_ecogaz_level_in_1_days',
            'sensor.signal_ecogaz_level_in_2_days',
            'sensor.signal_ecogaz_level_in_3_days',
            'sensor.signal_ecogaz_level_in_4_days',
          ],
          show_labels: true,
          compact: false,
        });
      } catch (e) {
        console.error('setConfig error:', e.message);
      }

      document.getElementById('container').appendChild(card);
      await card.updateComplete;
    }

    main().catch(console.error);
  </script>
</body>
</html>
